name: Official plugin packages

on:
  push:
    branches: ['main']
    tags: ['v*', 'sdk/v*']
  workflow_dispatch:
    inputs:
      action:
        description: 'Build packages only, or publish a new plugin collection from main'
        type: choice
        options: [build, release]
        default: build

permissions:
  contents: read

concurrency:
  group: official-plugin-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test release planning and publishing guards
        run: ./scripts/test-release.ps1
      - name: Plan plugin collection release
        id: release
        if: ${{ !startsWith(github.ref, 'refs/tags/sdk/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ startsWith(github.ref, 'refs/tags/v') && 'tag' || ((github.event_name == 'push' || inputs.action == 'release') && 'push' || 'build') }}
        run: ./scripts/prepare-release.ps1 -Action $env:RELEASE_ACTION -Tag $env:GITHUB_REF_NAME
      - name: Validate plugins
        if: steps.release.outputs.skip != 'true'
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Plugin vet failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Plugin tests failed' }
          Push-Location sdk
          try {
            go build ./...
            if ($LASTEXITCODE -ne 0) { throw 'SDK build failed' }
            go vet ./...
            if ($LASTEXITCODE -ne 0) { throw 'SDK vet failed' }
            go test ./...
            if ($LASTEXITCODE -ne 0) { throw 'SDK tests failed' }
          } finally { Pop-Location }
      - name: Package ZIPs and signed catalogue
        if: ${{ !startsWith(github.ref, 'refs/tags/sdk/') && steps.release.outputs.skip != 'true' }}
        env:
          FLUENTLAUNCHER_PLUGIN_PUBLIC_KEY: ${{ vars.FLUENTLAUNCHER_PLUGIN_PUBLIC_KEY }}
          FLUENTLAUNCHER_PLUGIN_PRIVATE_KEY: ${{ secrets.FLUENTLAUNCHER_PLUGIN_PRIVATE_KEY }}
        run: |
          $plan = Get-Content -Raw build/plugin-release-plan.json | ConvertFrom-Json
          ./scripts/build.ps1 -Tag $plan.tag -Signed:($plan.publish)
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/sdk/') && steps.release.outputs.skip != 'true' }}
        with:
          name: FluentLauncher-official-plugins
          path: build/release/*
          if-no-files-found: error
      - name: Publish plugin release
        if: steps.release.outputs.publish == 'true' && steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
