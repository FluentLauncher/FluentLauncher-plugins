name: Official plugin packages

on:
  push:
    tags: ['v*', 'sdk/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate plugins
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Plugin vet failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Plugin tests failed' }
          Push-Location sdk
          try {
            go build ./...
            if ($LASTEXITCODE -ne 0) { throw 'SDK build failed' }
            go vet ./...
            if ($LASTEXITCODE -ne 0) { throw 'SDK vet failed' }
            go test ./...
            if ($LASTEXITCODE -ne 0) { throw 'SDK tests failed' }
          } finally { Pop-Location }
      - name: Package ZIPs and signed catalogue
        if: ${{ !startsWith(github.ref, 'refs/tags/sdk/') }}
        env:
          FLUENTLAUNCHER_PLUGIN_PUBLIC_KEY: ${{ vars.FLUENTLAUNCHER_PLUGIN_PUBLIC_KEY }}
          FLUENTLAUNCHER_PLUGIN_PRIVATE_KEY: ${{ secrets.FLUENTLAUNCHER_PLUGIN_PRIVATE_KEY }}
        run: |
          $signed = $env:GITHUB_REF.StartsWith('refs/tags/v')
          $tag = 'local'
          if ($signed) { $tag = $env:GITHUB_REF_NAME }
          ./scripts/build.ps1 -Tag $tag -Signed:$signed
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/sdk/') }}
        with:
          name: FluentLauncher-official-plugins
          path: build/release/*
          if-no-files-found: error
      - name: Publish plugin release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Published plugin releases are immutable; use a new tag' }
          } else {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title $env:GITHUB_REF_NAME --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Creating draft failed' }
          }
          $assets = @(Get-ChildItem -LiteralPath build/release -File | ForEach-Object FullName)
          gh release upload $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --clobber @assets
          if ($LASTEXITCODE -ne 0) { throw 'Uploading packages failed' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing packages failed' }
